<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>RC Serviços | Gestão de campo</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6f8;color:#152333}
header.app-header{background:#fff;color:#152333;padding:0 20px;position:sticky;top:0;z-index:10;border-bottom:1px solid #e1e7eb;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:70px;padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{display:block;width:224px;height:auto;flex:none}.brand-copy{display:grid;gap:2px;min-width:0}.brand-copy strong{font-size:16px;line-height:1.1;white-space:nowrap}.brand-copy small{font-size:11px;color:#647385;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-actions{display:flex;align-items:center;gap:9px;flex:none}.header-actions a,.header-actions button{font:inherit;font-size:13px;font-weight:700;text-decoration:none;border-radius:9px;padding:10px 12px;min-height:42px;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.install-action{background:#14283a;color:#fff;border:1px solid #14283a}.business-link{border:1px solid #d6dfe6;color:#213c52;background:#fff}.skip-link{position:fixed;left:12px;top:-80px;z-index:30;background:#fff;padding:9px;border-radius:8px}.skip-link:focus{top:8px}.install-message{margin:12px auto 0;max-width:1100px;padding:13px 16px;background:#fff7e8;border:1px solid #e1c896;border-radius:10px;color:#5c4627;line-height:1.5}.install-message[hidden]{display:none}.install-message a{font-weight:700;color:#3d5f7b}
nav{background:#1f3448;padding:8px max(12px,calc((100vw - 1100px)/2));border-bottom:1px solid #dce3e8}.nav-list{display:flex;flex-wrap:wrap;gap:6px}.nav-mobile{display:none}
nav button{border:0;background:#354d63;color:#fff;padding:10px 13px;border-radius:8px;white-space:nowrap;min-height:42px;cursor:pointer}
nav button.active{background:#fff;color:#111827;font-weight:700}
main{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:14px;box-shadow:0 1px 5px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
h2,h3{margin:4px 0 12px}.muted{color:#6b7280}.stat{font-size:28px;font-weight:800}
label{font-size:12px;font-weight:700;color:#374151;display:block;margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px;position:relative;z-index:2;touch-action:manipulation;-webkit-user-select:text;user-select:text;border:1px solid #d1d5db;border-radius:8px;font:inherit;background:#fff}
textarea{min-height:80px;resize:vertical}
button.primary{background:#111827;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-weight:700}
button.secondary{background:#e5e7eb;color:#111827;border:0;border-radius:8px;padding:10px 14px}
button.danger{background:#fee2e2;color:#991b1b;border:0;border-radius:8px;padding:8px 10px}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}
.badge{display:inline-block;padding:4px 7px;border-radius:999px;background:#e5e7eb;font-size:11px}
.check{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #eee}.check input{width:auto}
.hidden{display:none!important}
#signature{width:100%;height:150px;border:1px dashed #9ca3af;border-radius:8px;background:#fff;touch-action:none}
.photoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}.photoGrid img{width:100%;height:120px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
@media print{header,nav,.no-print{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ddd}}


.card h2{font-size:19px}.card h3{font-size:16px}
@media(max-width:600px){main{padding:12px}.card{padding:14px}header.app-header{padding:env(safe-area-inset-top) 10px 0;gap:8px;min-height:0}.brand img{width:40vw;max-width:176px;height:auto}.brand-copy{display:none}.header-actions{gap:5px}.header-actions a,.header-actions button{font-size:11px;padding:8px;min-height:40px}.nav-list{display:none}.nav-mobile{display:block}.nav-mobile label{display:block;margin:0 0 5px;color:#dce7ee}.nav-mobile select{width:100%;min-height:45px;font-weight:700;background:#fff;color:#152333}.install-message{margin:8px 12px}}

.relatorio-financeiro{background:#fff;color:#111;width:100%;max-width:none}.rf-logo{display:block;width:100%;max-width:none;height:auto;max-height:none;object-fit:contain;object-position:center top;margin:0 0 14px}.rf-identidade{display:block;width:100%}.rf-titulo{flex:1}.rf-cabecalho{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #222;padding-bottom:14px;margin:20px 0}.rf-cabecalho h1{margin:0 0 8px;font-size:24px}.rf-cabecalho h2{margin:0 0 8px;font-size:18px}.rf-cabecalho p{margin:4px 0}.rf-gerado{font-size:12px;color:#666}.rf-resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.rf-resumo>div{border:1px solid #222;border-radius:8px;padding:14px}.rf-resumo small{display:block;color:#666}.rf-resumo strong{display:block;font-size:18px;margin-top:6px}.rf-tabela{overflow-x:auto}.rf-tabela table{width:100%;border-collapse:collapse}.rf-tabela th,.rf-tabela td{border:1px solid #222;padding:8px;text-align:left}.rf-tabela th{background:#eee}.rf-tabela td:last-child{text-align:right}@media print{body{background:#fff!important}.no-print{display:none!important}.relatorio-financeiro{box-shadow:none!important;border:1px solid #222!important;margin:0!important;padding:12px!important}.rf-resumo{grid-template-columns:repeat(4,1fr)}table{font-size:11px}}
@media(max-width:600px){.rf-logo{width:100%;max-width:100%;height:auto}.rf-identidade{gap:10px}.rf-cabecalho{flex-direction:column}.rf-gerado{margin-top:6px}}

.os-print-page{background:#fff;color:#111;border:1.5px solid #222;padding:22px;margin:0 auto;max-width:1000px;font-family:Arial,Helvetica,sans-serif}.os-print-page .docHeader{display:block;width:100%;margin:0 0 18px;border-bottom:2px solid #111;padding:0 0 10px}.os-print-page .docHeader img{display:block;width:100%;height:auto;max-width:none;max-height:none;object-fit:contain;object-position:center top;margin:0 0 12px}.os-print-page h2{border-bottom:1px solid #222;padding-bottom:5px}.os-print-page table{width:100%;border-collapse:collapse;border:1px solid #222}.os-print-page th,.os-print-page td{border:1px solid #222;padding:7px;text-align:left}.os-print-page .box{border:1px solid #222;padding:10px;margin:10px 0}.os-print-page .sig{max-width:280px;height:100px;border:1px solid #222}@media print{body{background:#fff!important}.no-print{display:none!important}.os-print-page{max-width:none;margin:0;border:1.5px solid #222;padding:18px;box-shadow:none!important}.os-print-page .docHeader img{width:100%}}

.rc-cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0 4px;text-align:center}.rc-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.rc-cal-day{min-height:92px;border:1px solid #ddd;border-radius:8px;padding:7px;cursor:pointer;background:#fff}.rc-cal-day:hover,.rc-cal-day.selected{outline:2px solid #222}.rc-cal-day.today{box-shadow:inset 0 0 0 2px #777}.rc-cal-day.empty{background:#f7f7f7;cursor:default}.rc-cal-dot{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;padding:2px 4px;border-radius:4px;background:#eee}.rc-cal-dot.done{opacity:.65;text-decoration:line-through}.rc-cal-dot.cancel{opacity:.45}.rc-agenda-item{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid #ddd;border-radius:10px;padding:12px;margin:8px 0}.rc-agenda-item .actions{flex-shrink:0}@media(max-width:700px){.rc-cal-day{min-height:68px;padding:4px;font-size:12px}.rc-cal-dot{font-size:9px}.rc-agenda-item{align-items:flex-start;flex-direction:column}.rc-agenda-item .actions{width:100%}.rc-agenda-item .actions button{margin-bottom:4px}}
button,a,select{touch-action:manipulation}button:hover,.install-action:hover{filter:brightness(1.08)}.business-link:hover{background:#eff4f7}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #c8863e;outline-offset:2px}.card{max-width:100%;overflow-x:auto}main{min-width:0}main table{min-width:520px}.stat{font-variant-numeric:tabular-nums}@media print{.app-header,nav,.install-message,.skip-link{display:none!important}}
@media(max-width:360px){.brand img{width:36vw;max-width:125px}.header-actions{gap:4px}.header-actions a,.header-actions button{font-size:10px;padding:6px;min-height:36px}}
</style>
</head>

<script>const tabs=[['home','Início'],['atend','Atendimentos'],['clientes','Clientes'],['equip','Equipamentos'],['os','Ordens de Serviço'],['orc','Orçamentos'],['pmoc','PMOC'],['ia','Assistência IA'],['relatorios','Relatórios'],['empresa','Minha Empresa'],['backup','Backup']];
let db;
const req=indexedDB.open('rcservicos',4);
req.onupgradeneeded=e=>{db=e.target.result;
 ['clientes','equip','os','fotos','orc','agenda','financeiro','estoque','contratos'].forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id',autoIncrement:true})});
};
req.onerror=e=>{console.error('Erro IndexedDB:',e.target.error); alert('Não foi possível abrir o banco de dados do sistema. Feche outras abas do RC Serviços e abra novamente.');};
req.onblocked=()=>{console.warn('IndexedDB bloqueado');};
req.onsuccess=e=>{db=e.target.result; db.onversionchange=()=>db.close(); init()};
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
function all(name){return new Promise((res,rej)=>{let r=store(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(name,obj){return new Promise((res,rej)=>{let r=store(name,'readwrite').put(obj);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function del(name,id){return new Promise((res,rej)=>{let r=store(name,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
async function init(){renderNav();show('home')}
function renderNav(){nav.innerHTML=tabs.map((t,i)=>`<button onclick="show('${t[0]}')" id="tab-${t[0]}">${t[1]}</button>`).join('') + `<button class="danger" style="margin-left:6px" onclick="zerarSistema()" title="Apagar todos os dados">🗑️ Zerar</button>`}
function active(n){document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+n)?.classList.add('active')}
async function show(n){active(n); if(n==='home')return home(); if(n==='atend')return atendimentos(); if(n==='clientes')return clientes();if(n==='equip')return equip();if(n==='os')return os();if(n==='orc')return orcamentos();if(n==='pmoc')return pmoc();if(n==='ia')return assistenciaIA();if(n==='relatorios')return relatorios();if(n==='empresa')return empresa();if(n==='backup')return backup()}
async function home(){let c=await all('clientes'),e=await all('equip'),o=await all('os'),q=await all('orc');let now=new Date().toISOString().slice(0,10);let pend=o.filter(x=>x.data>=now).length;app.innerHTML=`
<div class="grid">
<div class="card"><div class="muted">Clientes</div><div class="stat">${c.length}</div></div>
<div class="card"><div class="muted">Equipamentos</div><div class="stat">${e.length}</div></div>
<div class="card"><div class="muted">Ordens de serviço</div><div class="stat">${o.length}</div></div>
<div class="card"><div class="muted">Orçamentos</div><div class="stat">${q.length}</div></div>
</div>
<div class="card"><h2>Painel RC Serviços</h2><p>Organize toda a rotina: cliente → equipamento → orçamento → OS → checklist → medições → fotos → assinatura → PDF.</p>
<div class="actions"><button class="primary" onclick="show('clientes')">+ Novo cliente</button><button class="primary" onclick="show('equip')">+ Equipamento</button><button class="primary" onclick="show('orc')">+ Orçamento</button><button class="primary" onclick="show('os')">+ Nova OS</button><button class="secondary" onclick="show('pmoc')">PMOC</button></div></div>
<div class="card"><h3>Recursos da versão completa</h3><div class="grid">
<div>✔ OS numerada automaticamente</div><div>✔ Orçamento e aprovação</div><div>✔ Materiais e mão de obra</div><div>✔ Garantia e observações</div><div>✔ Checklist técnico</div><div>✔ Medições elétricas e frigoríficas</div><div>✔ Fotos e assinatura</div><div>✔ PDF profissional</div><div>✔ Histórico do equipamento</div><div>✔ Backup local</div></div></div>`}
async function clientes(){let cs=await all('clientes');app.innerHTML=`
<div class="card"><h2>Novo cliente</h2><div class="grid">
<div><label>Nome / Empresa</label><input id="cnome"></div><div><label>CPF/CNPJ</label><input id="ccpf"></div>
<div><label>Telefone/WhatsApp</label><input id="ctel"></div><div><label>E-mail</label><input id="cemail"></div>
<div><label>Endereço</label><input id="cend"></div><div><label>Responsável</label><input id="cres"></div>
</div><div class="actions"><button class="primary" onclick="saveCliente()">Salvar cliente</button></div></div>
<div class="card"><h2>Clientes cadastrados</h2>${cs.length?`<table><tr><th>Cliente</th><th>Contato</th><th>Endereço</th><th></th></tr>${cs.map(c=>`<tr><td><b>${esc(c.nome)}</b><br><span class="muted">${esc(c.cpf||'')}</span></td><td>${esc(c.tel||'')}<br>${esc(c.email||'')}</td><td>${esc(c.end||'')}</td><td><button class="danger" onclick="removeCliente(${c.id})">Excluir</button></td></tr>`).join('')}</table>`:'<p class="muted">Nenhum cliente cadastrado.</p>'}</div>`}
async function saveCliente(){await put('clientes',{nome:cnome.value,cpf:ccpf.value,tel:ctel.value,email:cemail.value,end:cend.value,res:cres.value});show('clientes')}
async function removeCliente(id){if(confirm('Excluir este cliente?')){await del('clientes',id);show('clientes')}}
const checklist=['Inspeção visual geral','EPI e proteção do ambiente','Desligamento e segurança elétrica','Limpeza dos filtros','Higienização da serpentina/evaporador','Limpeza da turbina/blower','Limpeza da bandeja de drenagem','Desobstrução e teste do dreno','Aplicação de bactericida/fungicida','Inspeção da condensadora','Verificação de vazamentos/anomalias','Inspeção visual das conexões elétricas','Medição de tensão','Medição de corrente','Medição de temperaturas','Teste final de funcionamento'];
async function equipBase(){let es=await all('equip'),cs=await all('clientes');app.innerHTML=`
<div class="card"><h2>Novo equipamento</h2><div class="grid">
<div><label>Cliente</label><select id="ecli">${cs.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('')}</select></div>
<div><label>Local</label><input id="elocal" placeholder="Sala, quarto, loja..."></div><div><label>Marca</label><input id="emarca"></div>
<div><label>Modelo</label><input id="emodelo" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" tabindex="0"></div><div><label>Potência / BTU/h</label><input id="ebtu" type="text" inputmode="numeric" autocomplete="off" tabindex="0"></div>
<div><label>Refrigerante</label><select id="egas"><option>R32</option><option>R410A</option><option>R22</option><option>Outro</option></select></div>
<div><label>Tensão</label><input id="etensao" placeholder="220 V"></div><div><label>Tipo</label><select id="etipo"><option>Split Hi-Wall</option><option>Split Cassete</option><option>Split Piso-Teto</option><option>Janela</option><option>Outro</option></select></div>

function rcTabelaAtendimentos(list,cs,es){if(!list.length)return '<p class="muted">Nenhum atendimento encontrado.</p>';return `<table><tr><th>OS</th><th>Data</th><th>Cliente</th><th>Equipamento</th><th>Status</th><th>Valor</th><th>Ações</th></tr>${list.slice().reverse().map(o=>{let c=cs.find(x=>Number(x.id)===Number(o.clienteId)),e=es.find(x=>Number(x.id)===Number(o.equipId)),v=(Number(o.mao)||0)+(Number(o.materiaisValor)||0)-(Number(o.desconto)||0);return `<tr><td>${o.id}</td><td>${esc(o.data||'')}</td><td>${esc(c?.nome||'')}</td><td>${esc((e?.marca||'')+' '+(e?.modelo||''))}</td><td><select onchange="alterarStatusAtendimento(${o.id},this.value)">${['Agendado','Em andamento','Aguardando aprovação','Aguardando peça','Concluído','Cancelado'].map(st=>`<option ${((o.status||'Em andamento')===st)?'selected':''}>${st}</option>`).join('')}</select></td><td>R$ ${v.toFixed(2)}</td><td><button class="secondary" onclick="report(${o.id})">OS</button> <button class="danger" onclick="removeOS(${o.id})">Excluir</button></td></tr>`}).join('')}</table>`}
async function alterarStatusAtendimento(id,status){let o=(await all('os')).find(x=>Number(x.id)===Number(id));if(!o)return;o.status=status;await put('os',o);show('atend')}
async function filtrarAtendimentos(status){const osx=await all('os'),cs=await all('clientes'),es=await all('equip');const list=status==='Todos'?osx:osx.filter(o=>(o.status||'Em andamento')===status);const box=document.getElementById('listaAtendimentos');if(box)box.innerHTML=rcTabelaAtendimentos(list,cs,es)}

async function relatorios(){let osx=await all('os'),cs=await all('clientes');app.innerHTML=`<div class="card"><h2>Histórico de serviços</h2>${osx.length?`<table><tr><th>OS</th><th>Data</th><th>Cliente</th><th>Serviço</th><th>Valor</th><th></th></tr>${osx.slice().reverse().map(o=>{let c=cs.find(x=>x.id==o.clienteId),v=(o.mao||0)+(o.materiaisValor||0)-(o.desconto||0);return `<tr><td>${o.id}</td><td>${o.data}</td><td>${esc(c?.nome||'')}</td><td>${esc(o.tipo)}</td><td>R$ ${v.toFixed(2)}</td><td><button class="secondary" onclick="report(${o.id})">Abrir</button></td></tr>`}).join('')}</table>`:'<p class="muted">Nenhum serviço registrado.</p>'}</div>`}

function rcNormal(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim()}

function rcPreencherCodigo(){const codigo=rcNormal(document.getElementById('rcCodigoErro')?.value);const marca=rcNormal(document.getElementById('rcMarcaErro')?.value);const box=document.getElementById('rcSugestoesCodigo');if(!box)return;let lista=RC_CODIGOS_ERRO.filter(x=>(!marca||rcNormal(x.m)===marca)&&(!codigo||rcNormal(x.c).startsWith(codigo))).slice(0,12);box.innerHTML=lista.map(x=>`<button class="secondary" style="margin:3px" onclick="document.getElementById('rcMarcaErro').value='${x.m}';document.getElementById('rcCodigoErro').value='${x.c}';rcBuscarCodigo()">${x.m} — ${x.c}</button>`).join('')}

async function zerarSistema(){
  const opcoes=[
    ['clientes','👤 Clientes','clientes cadastrados'],
    ['equip','❄️ Equipamentos','equipamentos cadastrados'],
    ['os','📋 Ordens de Serviço','ordens de serviço'],
    ['fotos','📷 Fotos','fotos anexadas'],
    ['orc','💰 Orçamentos','orçamentos'],
    ['agenda','📅 Agenda','compromissos da agenda'],
    ['financeiro','💵 Financeiro','lançamentos financeiros'],
    ['estoque','📦 Estoque','itens do estoque'],
    ['contratos','📝 Contratos','contratos'],
    ['empresa','🏢 Dados da Empresa','logo, CNPJ, endereço e dados cadastrados']
  ];
  const modal=document.createElement('div');
  modal.id='modalZerar';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box';
  modal.innerHTML=`<div style="background:var(--card,#fff);color:inherit;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:20px;box-sizing:border-box;box-shadow:0 10px 40px rgba(0,0,0,.4)">
    <h2 style="margin-top:0">🗑️ O que deseja apagar?</h2>
    <p class="muted">Selecione somente as informações que deseja excluir. A ação é permanente.</p>
    <div style="display:grid;gap:8px;margin:16px 0">${opcoes.map(([id,t,d])=>`<label style="display:flex;align-items:center;gap:10px;padding:11px;border:1px solid rgba(127,127,127,.25);border-radius:10px;cursor:pointer"><input type="checkbox" class="chkZerar" value="${id}" style="width:20px;height:20px"><span><b>${t}</b><br><small class="muted">${d}</small></span></label>`).join('')}</div>
    <div class="actions" style="display:flex;flex-wrap:wrap;gap:8px"><button class="secondary" id="zSelTodos">Selecionar tudo</button><button class="secondary" id="zCancelar">Cancelar</button><button class="danger" id="zApagar">🗑️ Apagar selecionados</button></div>
  </div>`;
  document.body.appendChild(modal);
  const checks=[...modal.querySelectorAll('.chkZerar')];
  modal.querySelector('#zSelTodos').onclick=()=>{const todos=checks.every(x=>x.checked);checks.forEach(x=>x.checked=!todos);modal.querySelector('#zSelTodos').textContent=todos?'Selecionar tudo':'Desmarcar tudo'};
  modal.querySelector('#zCancelar').onclick=()=>modal.remove();
  modal.querySelector('#zApagar').onclick=async()=>{
    const selecionados=checks.filter(x=>x.checked).map(x=>x.value);
    if(!selecionados.length){alert('Selecione pelo menos uma opção para apagar.');return;}
    const nomes=opcoes.filter(x=>selecionados.includes(x[0])).map(x=>x[1]).join(', ');
    if(!confirm('⚠️ Confirma apagar:\n\n'+nomes+'\n\nEssa ação não pode ser desfeita.'))return;
    const palavra=prompt('Para confirmar, digite APAGAR');
    if(palavra!=='APAGAR'){alert('Operação cancelada. Nenhuma informação foi apagada.');return;}
    try{
      await ready;
      const stores=selecionados.filter(x=>x!=='empresa');
      if(stores.length){
        const tx=db.transaction(stores,'readwrite');
        stores.forEach(n=>tx.objectStore(n).clear());
        await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Não foi possível apagar os dados.'));tx.onabort=()=>reject(tx.error||new Error('Operação cancelada.'));});
      }
      if(selecionados.includes('empresa'))localStorage.removeItem('rc_empresa');
      modal.remove();
      alert('✅ Exclusão concluída. Foram apagados somente os itens selecionados.');
      location.reload();
    }catch(e){console.error('Erro ao apagar dados:',e);alert('Não foi possível concluir a exclusão: '+(e?.message||String(e)));}
  };
}

window.relatorioFinanceiro=async function relatorioFinanceiro(){
 try{

  if(!/^[0-9]{4}-(0[1-9]|1[0-2])$/.test(escolhido)){

  }
  const itens=f.filter(x=>String(x.data||'').slice(0,7)===escolhido)

  const saidas=itens.filter(x=>x.tipo==='Saída').reduce((s,x)=>s+Number(x.valor||0),0);
  const servicos=itens.filter(x=>x.origem==='OS').reduce((s,x)=>s+Number(x.valor||0),0);
  const saldo=entradas-saidas;
  const [ano,mes]=escolhido.split('-');
  const nomes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const nomeMes=nomes[Number(mes)-1];
  const fmt=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const dataBR=d=>{if(!d)return '';const z=String(d).split('-');return z.length===3?`${z[2]}/${z[1]}/${z[0]}`:String(d)};

  app.innerHTML=`<div class="card relatorio-financeiro">

   <div class="rf-resumo"><div><small>Total de Entradas</small><strong>${fmt(entradas)}</strong></div><div><small>Total de Serviços</small><strong>${fmt(servicos)}</strong></div><div><small>Total de Saídas</small><strong>${fmt(saidas)}</strong></div><div><small>Saldo do Mês</small><strong>${fmt(saldo)}</strong></div></div>
   <h3>Movimentações do mês</h3>
   ${linhas?`<div class="rf-tabela"><table><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Valor</th></tr></thead><tbody>${linhas}</tbody></table></div>`:'<div class="card"><p>Nenhum lançamento financeiro encontrado neste mês.</p></div>'}
   <p class="muted" style="margin-top:20px">Relatório gerado automaticamente a partir dos lançamentos registrados no sistema RC Serviços.</p>
  </div>`;
 }catch(e){
  console.error('Erro ao gerar relatório financeiro:',e);
  app.innerHTML=`<div class="card"><h2>Erro ao gerar relatório financeiro</h2><p>Ocorreu um problema ao montar o relatório.</p><p class="muted">${esc(e?.message||String(e))}</p><div class="actions"><button class="secondary" onclick="financeiro()">Voltar ao Financeiro</button></div></div>`;
 }

<script>// Ajustes de dados e navegação mantidos separados do aplicativo original.
const RC_BACKUP_STORES = ['clientes', 'equip', 'os', 'fotos', 'orc', 'agenda', 'financeiro', 'estoque', 'contratos'];

function renderNav() {
  const options = tabs.map(([id, title]) => `<option value="${id}">${title}</option>`).join('');
  const buttons = tabs.map(([id, title]) => `<button type="button" onclick="show('${id}')" id="tab-${id}">${title}</button>`).join('');
  nav.innerHTML = `<div class="nav-list">${buttons}</div><div class="nav-mobile"><label for="section-select">Ir para seção</label><select id="section-select" onchange="show(this.value)">${options}</select></div>`;
}

function active(id) {
  document.querySelectorAll('#nav .nav-list button').forEach(button => button.classList.toggle('active', button.id === 'tab-' + id));
  const select = document.querySelector('#section-select');
  if (select) select.value = id;
}

let rcInstallPrompt;
window.addEventListener('beforeinstallprompt', event => {
  event.preventDefault();
  rcInstallPrompt = event;
});
document.querySelector('#rc-install').addEventListener('click', async () => {
  const message = document.querySelector('#rc-install-message');
  if (location.protocol === 'file:') {
    message.innerHTML = 'Você pode continuar usando este arquivo no Chrome. Para instalar o ícone PWA, faça um backup aqui e abra a <a href="https://tiago48255-cpu.github.io/apks-pai-painel/apps/rc-servicos/web/index.html">versão online do RC Serviços</a>. Os dados do arquivo não passam automaticamente para a versão online; restaure o backup nela.';
  } else if (rcInstallPrompt) {
    const prompt = rcInstallPrompt;
    rcInstallPrompt = null;
    await prompt.prompt();
    if ((await prompt.userChoice).outcome === 'accepted') return;
    message.textContent = 'Instalação cancelada. Para tentar de novo, use o menu ⋮ do Chrome.';
  } else if (window.matchMedia('(display-mode: standalone)').matches || window.RCAndroid) {
    message.textContent = 'O RC Serviços já está aberto como aplicativo.';
  } else {
    message.textContent = 'No Chrome do Android, abra o menu ⋮ e escolha “Instalar aplicativo” ou “Adicionar à tela inicial”.';
  }
  message.hidden = false;
  message.scrollIntoView({behavior:'smooth',block:'nearest'});
});

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('../../../service-worker.js').catch(console.error);
}

async function backup() {
  app.innerHTML = `<div class="card"><h2>Backup e restauração</h2>
    <p>Guarde uma cópia completa dos dados deste aparelho. O backup inclui clientes, equipamentos, OS, fotos, orçamentos, agenda, financeiro, estoque, contratos, empresa e diagnósticos.</p>
    <div class="actions"><button class="primary" onclick="exportData()">Baixar backup completo</button>
    <label class="secondary" style="display:inline-block;cursor:pointer">Restaurar backup
    <input type="file" accept=".json,application/json" onchange="importData(event)" style="display:none"></label></div>
    <p class="muted">A restauração substitui os dados atuais deste aparelho. Salve um backup antes de restaurar. O arquivo HTML, a versão online e o APK podem usar espaços de dados separados.</p></div>
    <div class="card danger-zone"><h3>Apagar dados</h3><p class="muted">Escolha exatamente o que deseja apagar. Esta ação exige confirmação.</p><button type="button" class="danger" onclick="zerarSistema()">Escolher dados para apagar</button></div>`;
}

async function exportData() {
  if (!db) throw new Error('Banco de dados ainda não está disponível.');
  const data = { format: 'rc-servicos-backup', version: 5, exportedAt: new Date().toISOString(), empresa: getEmpresa(), diagnosticos: rcDiagHistorico() };
  for (const name of RC_BACKUP_STORES) data[name] = await all(name);
  const filename = 'rc-servicos-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  if (window.RCAndroid?.saveBackup) {
    window.RCAndroid.saveBackup(JSON.stringify(data), filename);
    return;
  }
  const url = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function importData(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (!data || typeof data !== 'object' || !Array.isArray(data.clientes) || !Array.isArray(data.equip) || !Array.isArray(data.os)) {
      throw new Error('O arquivo não contém um backup RC Serviços válido.');
    }
    for (const name of RC_BACKUP_STORES) {
      if (data[name] !== undefined && (!Array.isArray(data[name]) || data[name].some(item => !item || typeof item !== 'object' || !Number.isInteger(item.id) || item.id < 1))) {
        throw new Error('Dados inválidos em ' + name + '.');
      }
    }
    const includedStores = RC_BACKUP_STORES.filter(name => Array.isArray(data[name]));
    const legacy = includedStores.length < RC_BACKUP_STORES.length;
    const warning = legacy
      ? 'Este backup antigo contém apenas parte das seções. As seções ausentes não serão alteradas. Guarde o arquivo antigo se houver dados de agenda, financeiro, estoque, contratos ou fotos.\n\n'
      : '';
    if (!confirm(warning + 'Substituir os dados das seções incluídas neste backup? Esta ação não pode ser desfeita.')) return;
    if (!db) throw new Error('Banco de dados ainda não está disponível.');
    await new Promise((resolve, reject) => {
      const tx = db.transaction(includedStores, 'readwrite');
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error || new Error('Falha ao restaurar.'));
      tx.onabort = () => reject(tx.error || new Error('Restauração cancelada.'));
      for (const name of includedStores) {
        const objectStore = tx.objectStore(name);
        objectStore.clear();
        for (const item of data[name]) objectStore.put(item);
      }
    });
    if (data.empresa && typeof data.empresa === 'object') localStorage.setItem('rc_empresa', JSON.stringify(data.empresa));
    if (Array.isArray(data.diagnosticos)) rcSalvarHistorico(data.diagnosticos);
    alert(legacy ? 'Backup antigo restaurado parcialmente. Confira as seções e mantenha o arquivo original.' : 'Backup restaurado com os vínculos originais preservados.');
    show('home');
  } catch (error) {
    console.error('Erro ao restaurar backup:', error);
    alert('Não foi possível restaurar: ' + error.message);
  } finally {
    event.target.value = '';
  }
}
