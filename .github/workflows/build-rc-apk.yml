name: Gerar APK RC Serviços

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/rc-servicos/android/**'
      - '.github/workflows/build-rc-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK de teste
        working-directory: apps/rc-servicos/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rc-servicos-apk
          path: apps/rc-servicos/android/app/build/outputs/apk/debug/app-debug.apk
